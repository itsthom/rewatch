[project]
name = "rewatch"
version = "0.0.1"
description = "Like watch, but prettier"
authors = [
    {name = "itsthom",email = "glargorn@gmail.com"}
]
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "textual (>=3.1.0,<4.0.0)",
    "typer (>=0.15.2,<0.16.0)"
]

[project.scripts]
rewatch = "rewatch.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
textual-dev = "^1.7.0"
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
flake8-bugbear = "^24.12.12"
pre-commit = "^4.2.0"

[tool.isort]
profile = "black"
